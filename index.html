<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary</title>
  <style>
    :root { --fs: 13px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, Arial, sans-serif;
      font-size: var(--fs);
      color: #1f2937;
      background: #ffffff;
      overflow-x: auto;
      padding-bottom: 36px;
    }

    /* Compact Single-Row Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
      gap: 6px;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mini-stats {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #475569;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .mini-stat {
      padding: 2px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      font-weight: 600;
      white-space: nowrap;
    }
    .mini-stat.unk { background: #fee2e2; color: #991b1b; }
    .mini-stat.knw { background: #dcfce7; color: #166534; }
    .sync-badge {
      font-size: 11px;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f1f5f9;
      white-space: nowrap;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      display: inline-block;
    }
    .sync-dot.loading { background: #f59e0b; }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .inp {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11.5px;
      height: 26px;
      outline: none;
      background: #fff;
    }
    .inp:focus { border-color: #137333; }
    .btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1f2937;
      border-radius: 4px;
      padding: 0 8px;
      height: 26px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-green { background: #135c37; color: #fff; border-color: #135c37; }
    .btn-green:hover { background: #0e4629; }

    /* Iconic Speaker On/Off Button */
    .spk-toggle {
      width: 30px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
      user-select: none;
      padding: 0;
    }
    .spk-toggle.on { background: #e6f4ea; border-color: #81c995; color: #137333; }
    .spk-toggle.off { background: #f1f5f9; border-color: #cbd5e1; color: #94a3b8; opacity: 0.8; }
    .spk-toggle:hover { transform: scale(1.04); }

    /* Font Size Control */
    .font-ctrl {
      display: inline-flex;
      align-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
      height: 26px;
      overflow: hidden;
      user-select: none;
    }
    .font-btn {
      border: none;
      background: transparent;
      color: #1f2937;
      padding: 0 8px;
      height: 100%;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .font-btn:hover { background: #e2e8f0; }
    .font-val {
      font-size: 10.5px;
      color: #475569;
      padding: 0 5px;
      border-left: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      min-width: 34px;
      text-align: center;
      font-weight: 600;
    }

    /* Tight Spreadsheet Table */
    .table-wrap { padding: 6px 8px; }
    table.sheet-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      font-size: var(--fs);
      border: 1px solid #bdc1c6;
    }
    table.sheet-table th {
      background: #135c37;
      color: #ffffff;
      font-weight: 700;
      font-size: calc(var(--fs) - 0.5px);
      padding: 5px 7px;
      border: 1px solid #0e4629;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 38px;
      z-index: 10;
    }
    table.sheet-table th.center,
    table.sheet-table td.center { text-align: center; }
    table.sheet-table td {
      padding: 3px 7px;
      border: 1px solid #dadce0;
      vertical-align: middle;
      line-height: 1.3;
      color: #202124;
      font-size: var(--fs);
    }
    table.sheet-table tr:nth-child(even) td { background: #fcfcfc; }
    table.sheet-table tr:hover td { background: #f1f8f4; }
    table.sheet-table tr.row-known td { background: #f4fbf7; }

    th.col-row { width: 28px; text-align: center; }
    td.col-row {
      width: 28px;
      color: #5f6368;
      font-size: calc(var(--fs) - 1px);
      background: #f8f9fa !important;
      text-align: center;
      user-select: none;
    }
    .col-date {
      width: 78px;
      white-space: nowrap;
      color: #3c4043;
      font-size: calc(var(--fs) - 0.5px);
    }
    .col-lvl { width: 44px; text-align: center; font-weight: 700; }
    .col-type {
      white-space: nowrap;
      width: 78px;
      font-size: calc(var(--fs) - 0.5px);
      color: #374151;
    }
    .col-word {
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.1s, background-color 0.15s;
      position: relative;
    }
    .col-word:hover { color: #135c37; text-decoration: underline; }
    .col-word.speaking { background-color: #dcfce7 !important; color: #135c37; }
    body.audio-muted .col-word { cursor: default; }
    body.audio-muted .col-word:hover { color: #111827; text-decoration: none; }
    .word-hover-ex {
      display: none;
      position: absolute;
      left: 6px;
      top: calc(100% + 22px);
      z-index: 50;
      background: #fffef7;
      color: #0f172a;
      border: 2px solid #135c37;
      border-left: 5px solid #135c37;
      font-weight: 600;
      font-size: calc(var(--fs) + 3.5px);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.24);
      white-space: normal;
      min-width: 280px;
      max-width: 440px;
      line-height: 1.45;
      pointer-events: none;
      text-decoration: none !important;
    }
    .col-word:hover .word-hover-ex {
      display: block;
    }
    .ex-tr {
      display: block;
      margin-top: 4px;
      color: #135c37;
      font-weight: 600;
      font-size: 0.92em;
    }

    .col-phonetic {
      color: #4b5563;
      font-size: calc(var(--fs) - 0.5px);
      white-space: nowrap;
    }
    .col-meaning { min-width: 130px; }
    .col-example { min-width: 200px; }
    .col-status { width: 122px; text-align: center; white-space: nowrap; }
    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: calc(var(--fs) - 1.5px);
      font-weight: 600;
      background: #e8eaed;
      color: #3c4043;
      min-width: 112px;
      text-align: center;
    }
    .status-pill.bilmiyorum { background: #fce8e6; color: #c5221f; }
    .status-pill.biliyorum { background: #e6f4ea; color: #137333; }
    .col-cb { width: 52px; text-align: center; }
    input.sheet-cb {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: #135c37;
      vertical-align: middle;
    }

    /* Pool Layout */
    .pool-layout {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 14px;
      align-items: start;
    }

    /* Bottom Sheet Tabs */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: #f1f3f4;
      border-top: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 30;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
    }
    .bottom-tabs { display: flex; align-items: center; gap: 2px; height: 100%; flex-wrap: nowrap; white-space: nowrap; }
    .sheet-tab {
      border: 1px solid transparent;
      border-top: none;
      background: transparent;
      padding: 0 12px;
      height: 29px;
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sheet-tab:hover { background: #e8eaed; }
    .sheet-tab.active {
      background: #ffffff;
      color: #137333;
      font-weight: 700;
      border-left-color: #dadce0;
      border-right-color: #dadce0;
      border-bottom: 2px solid #137333;
    }
    .bottom-info {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Compact Add Row Bar */
    .add-bar {
      display: none;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 10px;
      margin: 6px 8px 0;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
    }
    .add-bar.open { display: flex; }

    .toast {
      position: fixed;
      bottom: 36px;
      right: 14px;
      background: #202124;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* Flashcards View */
    .fc-wrap {
      max-width: 720px;
      margin: 18px auto 32px;
      padding: 0 12px;
      user-select: none;
    }
    .fc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
      flex-wrap: nowrap;
      white-space: nowrap;
      gap: 8px;
    }
    .fc-progress-track {
      width: 100%;
      height: 5px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .fc-progress-bar {
      height: 100%;
      background: #135c37;
      width: 0%;
      transition: width 0.2s ease;
    }
    .fc-scene {
      perspective: 1000px;
      width: 100%;
      height: 300px;
      cursor: pointer;
    }
    .fc-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fc-card.flipped {
      transform: rotateY(180deg);
    }
    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .fc-face.fc-back {
      transform: rotateY(180deg);
      background: #f8faf9;
      border-color: #86efac;
    }
    .fc-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .fc-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fc-lvl-badge {
      background: #135c37;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .fc-type-badge {
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }
    .fc-center {
      text-align: center;
      margin: auto 0;
    }
    .fc-word-box {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
    }
    .fc-word {
      font-size: calc(var(--fs) * 2.2);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      display: inline-block;
      transition: color 0.15s;
    }
    .fc-word-box:hover .fc-word {
      color: #135c37;
    }
    .fc-hover-example {
      font-size: calc(var(--fs) + 3.5px);
      font-weight: 600;
      color: #0f172a;
      background: #fffef7;
      border: 2px solid #135c37;
      border-left: 5px solid #135c37;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
      line-height: 1.45;
      max-width: 480px;
      margin: 24px auto 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
      text-align: left;
    }
    .fc-word-box:hover .fc-hover-example {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .fc-meaning {
      font-size: calc(var(--fs) * 1.55);
      font-weight: 700;
      color: #135c37;
      margin-bottom: 10px;
    }
    .fc-example {
      font-size: calc(var(--fs) * 1.05);
      color: #334155;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      line-height: 1.4;
    }
    .fc-hint {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
    }
    .fc-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
    }
    .fc-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1f2937;
      border-radius: 6px;
      padding: 0 11px;
      height: 32px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .fc-btn:hover { background: #f1f5f9; }
    .fc-btn-known {
      background: #135c37;
      color: #fff;
      border-color: #135c37;
    }
    .fc-btn-known:hover { background: #0e4629; }
    .fc-btn-toggle-on {
      background: #dcfce7;
      color: #14532d;
      border-color: #22c55e;
      font-weight: 700;
    }
    .fc-btn-toggle-on:hover { background: #bbf7d0; }
    .fc-below-card {
      margin-top: 12px;
      border: 2px solid #86efac;
      border-left: 5px solid #135c37;
      border-radius: 10px;
      background: #f8faf9;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      padding: 14px 18px;
      text-align: center;
    }
    .fc-below-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .fc-empty {
      text-align: center;
      padding: 36px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      color: #64748b;
      background: #f8fafc;
    }
    .study-modes-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
    }
    .mode-btn {
      flex: 1;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      border-radius: 6px;
      padding: 0 10px;
      height: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mode-btn:hover { background: #e2e8f0; }
    .mode-btn.active {
      background: #135c37;
      color: #ffffff;
      border-color: #135c37;
    }
    .srs-badge {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .study-box {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      padding: 18px 20px;
    }
    .cloze-sentence {
      font-size: calc(var(--fs) * 1.35);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
      margin: 14px 0 8px;
      text-align: center;
    }
    .cloze-blank {
      display: inline-block;
      min-width: 90px;
      border-bottom: 3px solid #135c37;
      color: #135c37;
      padding: 0 6px;
      margin: 0 3px;
    }
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .choice-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      border-radius: 7px;
      padding: 10px 12px;
      font-size: calc(var(--fs) * 1.05);
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }
    .choice-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .choice-btn.correct { background: #dcfce7 !important; border-color: #16a34a !important; color: #14532d !important; }
    .choice-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #7f1d1d !important; }
    .type-row {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
    }
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .match-item {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 7px;
      padding: 10px 12px;
      font-size: calc(var(--fs) * 1.02);
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }
    .match-item:hover { background: #f8fafc; }
    .match-item.selected { border: 2px solid #135c37; background: #f0fdf4; color: #135c37; }
    .match-item.matched { background: #dcfce7; border-color: #86efac; color: #15803d; opacity: 0.55; pointer-events: none; text-decoration: line-through; }
    .match-item.wrong { background: #fee2e2; border-color: #f87171; }
    .btn.active-mode { background: #135c37; color: #ffffff; border-color: #0e4629; }
    .btn.active-mode:hover { background: #0e4629; }

    @media (max-width: 900px) {
      .pool-layout { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="mini-stats">
        <span class="mini-stat" id="stTotal">Total: -</span>
        <span class="mini-stat unk" id="stUnk">In Pool: -</span>
        <span class="mini-stat knw" id="stKnw">Known: -</span>
      </div>
      <span class="sync-badge" id="syncBadge" title="Two-way live sync with Google Sheets (Sheet1)">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Live</span>
      </span>
    </div>
    <div class="toolbar-right">
      <button class="spk-toggle on" id="audioToggleBtn" onclick="sesAcKapat()" title="Audio ON: Click any word to hear pronunciation (Click to mute)">🔊</button>
      <div class="font-ctrl" title="Decrease / Increase Font Size">
        <button class="font-btn" onclick="yaziBoyutuDegistir(-1)">A-</button>
        <span class="font-val" id="fontValLabel">13px</span>
        <button class="font-btn" onclick="yaziBoyutuDegistir(1)">A+</button>
      </div>
      <input type="text" id="searchInput" class="inp" placeholder="Search..." style="width:125px;" oninput="tercihleriKaydet(); tabloyuCiz();">

            else if (hk === "type" || hk === "tür" || hk === "tur") map.type = n;
            else if (hk === "level" || hk === "seviye") map.level = n;
            else if (hk.indexOf("meaning") !== -1 || hk.indexOf("anlam") !== -1) map.meaning = n;

      for (var p = startIdx; p < allRows.length; p++) {
        var dRow = allRows[p];
        var w = (dRow[map.word] || "").trim();
        if (!w || w.toLowerCase() === "word" || w.toLowerCase() === "kelime") continue;
        var kVal = (dRow[map.known] || "").toUpperCase();
        var uVal = (dRow[map.unknown] || "").toUpperCase();
        var durum = (kVal === "TRUE") ? "biliyorum" : ((uVal === "FALSE" && kVal === "FALSE") ? "beklemede" : "bilmiyorum");
        parsed.push({
          row: parsed.length + 2,
          tarih: dRow[map.date] || "",
          kelime: w,
          okunus: dRow[map.pron] || "",
          tur: dRow[map.type] || "",
          seviye: dRow[map.level] || "B1",
          anlam: dRow[map.meaning] || "",
          ornek: dRow[map.example] || "",
          durum: durum
        });
      }
      return parsed;
    }

    window.__onSheetData = function(response) {
      try {
        if (response && response.table) {
          var liste = gvizTablosunuCozumle(response.table);
          if (liste && liste.length > 0) {
            SHEET_KELIMELER = liste;
            listeyiBirlestirVeHazirla(SHEET_KELIMELER, true);
            document.getElementById("syncDot").className = "sync-dot";
            document.getElementById("syncText").innerText = "Live (" + liste.length + ")";
            return;
          }
        }
      } catch (e) {}
    };

    function verileriYukle(bildirimli) {
      document.getElementById("syncDot").className = "sync-dot loading";
      document.getElementById("syncText").innerText = "Syncing...";

      // 1. Primary live sync via Apps Script JSON endpoint (zero cache delay, exact row numbers)
      appsScripttenYukle();

      // 2. Fast JSONP from Google Sheets gviz endpoint
      var oldScript = document.getElementById("gvizJsonpScript");
      if (oldScript && oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);
      var s = document.createElement("script");
      s.id = "gvizJsonpScript";
      s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=responseHandler:__onSheetData&sheet=Sheet1&_=" + Date.now();
      document.body.appendChild(s);

      if (bildirimli) {
        bildirimGoster("🔄 Synced with Google Sheet");
      }
    }

    function appsScripttenYukle() {
      if (!APPS_SCRIPT_URL) return;
      fetch(APPS_SCRIPT_URL + "?action=json&_=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res && res.ok && res.words && res.words.length > 0) {
            SHEET_KELIMELER = res.words;
            listeyiBirlestirVeHazirla(SHEET_KELIMELER, true);
            document.getElementById("syncDot").className = "sync-dot";
            document.getElementById("syncText").innerText = "Live (" + res.words.length + ")";
          }
        })
        .catch(function() {});
    }

    var FC_INDEX = 0;
    var FC_FLIPPED = false;
    var FC_SHUFFLED_KEYS = null;
    var AKTIF_MOD = "flashcards";
    var SECENEKLER_CACHE = { key: "", list: [] };
    var MATCH_DURUM = { seciliEn: null, seciliTr: null, eslesenler: {}, trSira: [], keySet: "" };

    function srsMapAl() {
      try {
        return JSON.parse(localStorage.getItem("kelime_srs_sayac_v1") || "{}");
      } catch (e) {
        return {};
      }
    }

    function srsGetir(kelime) {
      var map = srsMapAl();
      var k = (kelime || "").toString().trim().toLowerCase();
      return map[k] || 0;
    }

    function srsArtir(card) {
      if (!card || !card.kelime) return false;
      var map = srsMapAl();
      var k = card.kelime.toString().trim().toLowerCase();
      var yeni = (map[k] || 0) + 1;
      if (yeni >= 3) {
        map[k] = 0;
        try { localStorage.setItem("kelime_srs_sayac_v1", JSON.stringify(map)); } catch (e) {}
        kutucukDegisti(card.row, "biliyorum", true);
        bildirimGoster("🎉 Mastered (3/3): " + card.kelime + " → Known!");
        return true;
      } else {
        map[k] = yeni;
        try { localStorage.setItem("kelime_srs_sayac_v1", JSON.stringify(map)); } catch (e) {}
        bildirimGoster("⭐ Progress (" + yeni + "/3): " + card.kelime);
        return false;
      }
    }

    function tercihleriKaydet() {
      try {
        var addBarEl = document.getElementById("addBar");
        var lvlEl = document.getElementById("levelFilter");
        var qEl = document.getElementById("searchInput");
        var inSevEl = document.getElementById("inSeviye");
        var inTurEl = document.getElementById("inTur");
        var prefs = {
          aktifSekme: AKTIF_SEKME,
          aktifMod: AKTIF_MOD,
          fcIndex: FC_INDEX,
          fcShuffledKeys: FC_SHUFFLED_KEYS,
          fcAltKartAcik: !!window.FC_ALT_KART_ACIK,
          yaziBoyutu: YAZI_BOYUTU,
          sesAcik: SES_ACIK,
          levelFilter: lvlEl ? lvlEl.value : "ALL",
          searchQuery: qEl ? qEl.value : "",
          addBarOpen: addBarEl ? addBarEl.classList.contains("open") : false,
          inSeviye: inSevEl ? inSevEl.value : "B2",
          inTur: inTurEl ? inTurEl.value : "Adjective"
        };
        localStorage.setItem("kelime_ui_tercihler_v1", JSON.stringify(prefs));
      } catch (e) {}
    }

    function tercihleriYukleVeUygula() {
      try {
        var raw = localStorage.getItem("kelime_ui_tercihler_v1");
        if (!raw) return;
        var p = JSON.parse(raw);
        if (!p) return;
        if (typeof p.yaziBoyutu === "number" && p.yaziBoyutu >= 9 && p.yaziBoyutu <= 20) {
          YAZI_BOYUTU = p.yaziBoyutu;
          yaziBoyutuUygula();
        }
        if (typeof p.sesAcik === "boolean") {
          SES_ACIK = p.sesAcik;
          sesDurumuUygula();
        }
        if (typeof p.fcAltKartAcik === "boolean") {
          window.FC_ALT_KART_ACIK = p.fcAltKartAcik;
        }
        if (typeof p.fcIndex === "number" && p.fcIndex >= 0) {
          FC_INDEX = p.fcIndex;
        }
        if (Array.isArray(p.fcShuffledKeys) && p.fcShuffledKeys.length > 0) {
          FC_SHUFFLED_KEYS = p.fcShuffledKeys;
        }
        var lvlEl = document.getElementById("levelFilter");
        if (lvlEl && p.levelFilter) lvlEl.value = p.levelFilter;
        var qEl = document.getElementById("searchInput");
        if (qEl && typeof p.searchQuery === "string") qEl.value = p.searchQuery;
        var inSevEl = document.getElementById("inSeviye");
        if (inSevEl && p.inSeviye) inSevEl.value = p.inSeviye;
        var inTurEl = document.getElementById("inTur");
        if (inTurEl && p.inTur) inTurEl.value = p.inTur;
        var addBarEl = document.getElementById("addBar");
        if (addBarEl && p.addBarOpen) addBarEl.classList.add("open");

        if (p.aktifMod) AKTIF_MOD = p.aktifMod;
        if (p.aktifSekme) AKTIF_SEKME = p.aktifSekme;

        document.getElementById("sheet1View").style.display = AKTIF_SEKME === "sheet1" ? "block" : "none";
        document.getElementById("poolView").style.display = AKTIF_SEKME === "pool" ? "block" : "none";
        document.getElementById("flashcardView").style.display = AKTIF_SEKME === "flashcards" ? "block" : "none";
        sekmeButonlariniGuncelle();
      } catch (e) {}
    }

    function sekmeButonlariniGuncelle() {
      var s = AKTIF_SEKME;
      var m = AKTIF_MOD;
      document.getElementById("tabBtn-sheet1").classList.toggle("active", s === "sheet1");
      document.getElementById("tabBtn-pool").classList.toggle("active", s === "pool");
      var studyTabs = ["flashcards", "cloze", "quiz", "listen", "match"];
      for (var i = 0; i < studyTabs.length; i++) {
        var tName = studyTabs[i];
        var el = document.getElementById("tabBtn-" + tName);
        if (el) el.classList.toggle("active", s === "flashcards" && m === tName);
        var topEl = document.getElementById("topBtn-" + tName);

      }

    function sekmeDegistir(s) {
      AKTIF_SEKME = s;
      sekmeButonlariniGuncelle();
      document.getElementById("sheet1View").style.display = s === "sheet1" ? "block" : "none";
      document.getElementById("poolView").style.display = s === "pool" ? "block" : "none";
      document.getElementById("flashcardView").style.display = s === "flashcards" ? "block" : "none";

    function calismaModuAc(mod) {
      AKTIF_MOD = mod || "flashcards";
      AKTIF_SEKME = "flashcards";
      FC_FLIPPED = false;
      SECENEKLER_CACHE = { key: "", list: [] };
      if (mod === "match") {
        MATCH_DURUM = { seciliEn: null, seciliTr: null, eslesenler: {}, trSira: [], keySet: "" };
      }
      sekmeButonlariniGuncelle();
      document.getElementById("sheet1View").style.display = "none";
      document.getElementById("poolView").style.display = "none";
      document.getElementById("flashcardView").style.display = "block";
      tercihleriKaydet();
      tabloyuCiz();
      if (mod === "listen") {
        setTimeout(function() {
          var poolList = aktifHavuzuGetir();
          var deck = fcDestesiniGetir(poolList);
          if (deck.length) {
            var card = deck[FC_INDEX % deck.length];
            if (card) kelimeOku(card.kelime);
          }
        }, 120);
      }
    }

    function aktifHavuzuGetir() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var lvl = document.getElementById("levelFilter").value;
      return TUM_KELIMELER.filter(function(w){
        if (w.durum !== "bilmiyorum") return false;
        if (lvl !== "ALL" && w.seviye !== lvl) return false;
        if (q && (w.kelime + " " + w.anlam + " " + w.ornek).toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort(function(a, b){ return (a.seviye || "").localeCompare(b.seviye || ""); });
    }

    function fcDestesiniGetir(poolList) {
      if (!FC_SHUFFLED_KEYS || !FC_SHUFFLED_KEYS.length) return poolList;
      var byKey = {};
      for (var i = 0; i < poolList.length; i++) {
        byKey[poolList[i].kelime.toLowerCase()] = poolList[i];
      }
      var result = [];
      var used = {};
      for (var j = 0; j < FC_SHUFFLED_KEYS.length; j++) {
        var k = FC_SHUFFLED_KEYS[j];
        if (byKey[k]) {
          result.push(byKey[k]);
          used[k] = true;
        }
      }
      for (var m = 0; m < poolList.length; m++) {
        var km = poolList[m].kelime.toLowerCase();
        if (!used[km]) result.push(poolList[m]);
      }
      return result;
    }

    function modCubuguHtml() {
      var modes = [
        { id: "flashcards", label: "🃏 Flashcards" },
        { id: "cloze", label: "📝 Cloze (Boşluk Doldur)" },
        { id: "quiz", label: "🎯 Quiz (TR → EN)" },
        { id: "listen", label: "🎧 Listen (Dinle & Bul)" },
        { id: "match", label: "🧩 Match (5'li Eşleştir)" }
      ];
      var html = ['<div class="study-modes-bar">'];
      for (var i = 0; i < modes.length; i++) {
        var m = modes[i];
        html.push(
          '<button class="mode-btn' + (AKTIF_MOD === m.id ? ' active' : '') + '" onclick="calismaModuAc(\'' + m.id + '\')">' +
            m.label +
          '</button>'
        );
      }
      html.push('</div>');
      return html.join("");
    }

    function secenekleriUret(dogruCard, tumHavuz) {
      var cacheKey = AKTIF_MOD + ":" + dogruCard.kelime.toLowerCase();
      if (SECENEKLER_CACHE.key === cacheKey && SECENEKLER_CACHE.list.length === 4) {
        return SECENEKLER_CACHE.list;
      }
      var adaylar = TUM_KELIMELER.filter(function(w) {
        return w.kelime.toLowerCase() !== dogruCard.kelime.toLowerCase();
      });
      for (var i = adaylar.length - 1; i > 0; i--) {
        var r = Math.floor(Math.random() * (i + 1));
        var tmp = adaylar[i];
        adaylar[i] = adaylar[r];
        adaylar[r] = tmp;
      }
      var secenekler = [dogruCard];
      for (var j = 0; j < Math.min(3, adaylar.length); j++) {
        secenekler.push(adaylar[j]);
      }
      for (var k = secenekler.length - 1; k > 0; k--) {
        var rk = Math.floor(Math.random() * (k + 1));
        var tk = secenekler[k];
        secenekler[k] = secenekler[rk];
        secenekler[rk] = tk;
      }
      SECENEKLER_CACHE = { key: cacheKey, list: secenekler };
      return secenekler;
    }

    function ornekCumleyiAyir(ornek) {
      var s = (ornek || "").toString().trim();
      var m = s.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      if (m) {
        return { en: m[1].trim(), tr: m[2].trim() };
      }
      return { en: s, tr: "" };
    }

    function cumledeKelimeyiGizle(enCumle, kelime) {
      if (!enCumle) return '<span class="cloze-blank" id="clozeBlankEl">_______</span>';
      var temizKelime = (kelime || "").trim();
      var kok = temizKelime.length > 4 ? temizKelime.slice(0, -1) : temizKelime;
      var escKok = kok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      var rgx = new RegExp("\\b" + escKok + "[a-zA-Z]*\\b", "i");
      var guvenli = escHtml(enCumle);
      if (rgx.test(guvenli)) {
        return guvenli.replace(rgx, '<span class="cloze-blank" id="clozeBlankEl">_______</span>');
      }
      return guvenli + ' (<span class="cloze-blank" id="clozeBlankEl">_______</span>)';
    }

    function clozeModuCiz(box, deck) {

    function matchModuCiz(box, deck) {
      var grupBoyutu = Math.min(5, deck.length);
      var baslangic = Math.floor(FC_INDEX / 5) * 5;
      if (baslangic >= deck.length) baslangic = 0;
      var altListe = deck.slice(baslangic, baslangic + grupBoyutu);
      var grupKey = altListe.map(function(w){ return w.kelime.toLowerCase(); }).join("|");

      if (MATCH_DURUM.keySet !== grupKey) {
        var trIndisler = [];
        for (var i = 0; i < altListe.length; i++) trIndisler.push(i);
        for (var j = trIndisler.length - 1; j > 0; j--) {
          var r = Math.floor(Math.random() * (j + 1));
          var tmp = trIndisler[j];
          trIndisler[j] = trIndisler[r];
          trIndisler[r] = tmp;
        }
        MATCH_DURUM = {
          seciliEn: null,
          seciliTr: null,
          eslesenler: {},
          trSira: trIndisler,
          keySet: grupKey
        };
      }

      var enHtml = [];
      var trHtml = [];
      var eslesenSayisi = 0;

      for (var m = 0; m < altListe.length; m++) {
        var wEn = altListe[m];
        var kEn = wEn.kelime.toLowerCase();
        var isMatchedEn = !!MATCH_DURUM.eslesenler[kEn];
        if (isMatchedEn) eslesenSayisi++;
        var isSelEn = MATCH_DURUM.seciliEn === kEn;
        enHtml.push(
          '<div class="match-item' + (isMatchedEn ? ' matched' : '') + (isSelEn ? ' selected' : '') + '" onclick="matchEnSec(\'' + escJs(kEn) + '\', \'' + escJs(wEn.kelime) + '\')">' +
            '<span>' + escHtml(wEn.kelime) + '</span>' +
            '<span class="srs-badge">⭐ ' + srsGetir(wEn.kelime) + '/3</span>' +
          '</div>'
        );
      }

      for (var n = 0; n < MATCH_DURUM.trSira.length; n++) {
        var idx = MATCH_DURUM.trSira[n];
        var wTr = altListe[idx];
        if (!wTr) continue;
        var kTr = wTr.kelime.toLowerCase();
        var isMatchedTr = !!MATCH_DURUM.eslesenler[kTr];
        var isSelTr = MATCH_DURUM.seciliTr === kTr;
        trHtml.push(
          '<div class="match-item' + (isMatchedTr ? ' matched' : '') + (isSelTr ? ' selected' : '') + '" id="matchTr-' + idx + '" onclick="matchTrSec(\'' + escJs(kTr) + '\', ' + idx + ')">' +
            escHtml(wTr.anlam) +
          '</div>'
        );
      }

      var hepsiBitti = eslesenSayisi === altListe.length;

      box.innerHTML =
        modCubuguHtml() +
        '<div class="fc-top">' +
          '<span>🧩 5-Word Quick Match — <b>Matched: ' + eslesenSayisi + ' / ' + altListe.length + '</b></span>' +
          '<button class="btn" onclick="matchYeniSet()">🔄 Next Set</button>' +
        '</div>' +
        '<div class="study-box">' +
          '<div style="font-size:12px;color:#475569;font-weight:600;">Click an English word on the left (it will also read it aloud) and match it with its Turkish meaning on the right:</div>' +
          '<div class="match-grid">' +
            '<div class="match-col">' + enHtml.join("") + '</div>' +
            '<div class="match-col">' + trHtml.join("") + '</div>' +
          '</div>' +
          (hepsiBitti
            ? '<div style="text-align:center;padding:10px;background:#dcfce7;border:1px solid #86efac;border-radius:8px;color:#166534;font-weight:700;">' +
                '🎉 Great job! All ' + altListe.length + ' words matched! ' +
                '<button class="fc-btn fc-btn-known" style="margin-left:10px;" onclick="matchYeniSet()">Next 5 Words ▶</button>' +
              '</div>'
            : '') +
        '</div>';
    }

    function matchEnSec(kEn, orijinalKelime) {
      if (MATCH_DURUM.eslesenler[kEn]) return;
      kelimeOku(orijinalKelime);
      MATCH_DURUM.seciliEn = kEn;
      matchKontrolEt();
    }

    function matchTrSec(kTr, idx) {
      if (MATCH_DURUM.eslesenler[kTr]) return;
      MATCH_DURUM.seciliTr = kTr;
      matchKontrolEt(idx);
    }

    function matchKontrolEt(sonTrIdx) {
      if (MATCH_DURUM.seciliEn && MATCH_DURUM.seciliTr) {
        var en = MATCH_DURUM.seciliEn;
        var tr = MATCH_DURUM.seciliTr;
        if (en === tr) {
          MATCH_DURUM.eslesenler[en] = true;
          MATCH_DURUM.seciliEn = null;
          MATCH_DURUM.seciliTr = null;
          var card = TUM_KELIMELER.filter(function(w){ return w.kelime.toLowerCase() === en; })[0];
          if (card) srsArtir(card);
          tabloyuCiz();
        } else {
          MATCH_DURUM.seciliEn = null;
          MATCH_DURUM.seciliTr = null;
          bildirimGoster("❌ Not a match, try again!");
          tabloyuCiz();
        }
      } else {
        tabloyuCiz();
      }
    }

    function fcKaristir() {
      var unk = TUM_KELIMELER.filter(function(w){ return w.durum === "bilmiyorum"; }).map(function(w){ return w.kelime.toLowerCase(); });
      for (var i = unk.length - 1; i > 0; i--) {
        var r = Math.floor(Math.random() * (i + 1));
        var tmp = unk[i];
        unk[i] = unk[r];
        unk[r] = tmp;
      }
      FC_SHUFFLED_KEYS = unk;
      FC_INDEX = 0;
      FC_FLIPPED = false;
      SECENEKLER_CACHE = { key: "", list: [] };
      MATCH_DURUM = { seciliEn: null, seciliTr: null, eslesenler: {}, trSira: [], keySet: "" };
      tercihleriKaydet();
      tabloyuCiz();
      bildirimGoster("🔀 Shuffled");
    }

    document.addEventListener("keydown", function(e) {
      if (AKTIF_SEKME !== "flashcards" || AKTIF_MOD !== "flashcards") return;
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        fcCevir();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        fcDegistir(1);
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        fcDegistir(-1);
      }
    });

    function tabloyuCiz() {
      var total = TUM_KELIMELER.length, unk = 0, knw = 0;
      var lvlCounts = { B1: 0, B2: 0, C1: 0, C2: 0 };
      for (var i = 0; i < TUM_KELIMELER.length; i++) {
        var w = TUM_KELIMELER[i];
        if (w.durum === "bilmiyorum") {
          unk++;
          lvlCounts[w.seviye] = (lvlCounts[w.seviye] || 0) + 1;
        } else if (w.durum === "biliyorum") knw++;
      }
      document.getElementById("stTotal").innerText = "Total: " + total;
      document.getElementById("stUnk").innerText = "In Pool: " + unk;
      document.getElementById("stKnw").innerText = "Known: " + knw;
      var fcTabBtn = document.getElementById("tabBtn-flashcards");
      if (fcTabBtn) fcTabBtn.innerText = "🃏 Flashcards (" + unk + ")";

      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var lvl = document.getElementById("levelFilter").value;

      var s1Rows = [];
      for (var j = 0; j < TUM_KELIMELER.length; j++) {
        var x = TUM_KELIMELER[j];
        if (lvl !== "ALL" && x.seviye !== lvl) continue;
        if (q && (x.kelime + " " + x.anlam + " " + x.ornek).toLowerCase().indexOf(q) === -1) continue;
        s1Rows.push(
          '<tr class="' + (x.durum === "biliyorum" ? "row-known" : "") + '">' +
            '<td class="col-row">' + x.row + '</td>' +
            '<td class="col-date">' + escHtml(x.tarih) + '</td>' +
            '<td class="col-lvl">' + escHtml(x.seviye) + '</td>' +
            '<td class="col-type">' + escHtml(turTemizle(x.tur)) + '</td>' +
            '<td class="col-word" onclick="kelimeOku(\'' + escJs(x.kelime) + '\', this)">' +
              escHtml(x.kelime) +
              (x.ornek ? '<div class="word-hover-ex">' + ornekBicimlendir(x.ornek) + '</div>' : '') +
            '</td>' +
            '<td class="col-meaning">' + escHtml(x.anlam) + '</td>' +
            '<td class="col-example">' + escHtml(x.ornek) + '</td>' +
            '<td class="col-status"><span class="status-pill ' + x.durum + '">' + durumMetniGetir(x.durum) + '</span></td>' +
            '<td class="col-cb"><input type="checkbox" class="sheet-cb" ' + (x.biliyorum ? "checked" : "") + ' onchange="kutucukDegisti(' + x.row + ', \'biliyorum\', this.checked)"></td>' +
            '<td class="col-cb"><input type="checkbox" class="sheet-cb" ' + (x.bilmiyorum ? "checked" : "") + ' onchange="kutucukDegisti(' + x.row + ', \'bilmiyorum\', this.checked)"></td>' +
          '</tr>'
        );
      }
      document.getElementById("sheet1Body").innerHTML = s1Rows.join("") || '<tr><td colspan="10" class="center" style="padding:14px;">No words found.</td></tr>';

      var sumLvls = ["A1", "A2", "B1", "B2", "C1", "C2"];
      var sumHtml = [];
      for (var k = 0; k < sumLvls.length; k++) {
        var sl = sumLvls[k];
        if (lvlCounts[sl] !== undefined || sl === "B1" || sl === "B2" || sl === "C1" || sl === "C2") {
          sumHtml.push('<tr><td>' + sl + '</td><td class="center">' + (lvlCounts[sl] || 0) + '</td></tr>');
        }
      }
      document.getElementById("poolSummaryBody").innerHTML = sumHtml.join("");

      var poolList = TUM_KELIMELER.filter(function(w){
        if (w.durum !== "bilmiyorum") return false;
        if (lvl !== "ALL" && w.seviye !== lvl) return false;
        if (q && (w.kelime + " " + w.anlam + " " + w.ornek).toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort(function(a, b){ return (a.seviye || "").localeCompare(b.seviye || ""); });

      var pRows = [];
      for (var m = 0; m < poolList.length; m++) {
        var p = poolList[m];
        pRows.push(
          '<tr>' +
            '<td class="col-lvl">' + escHtml(p.seviye) + '</td>' +
            '<td class="col-type">' + escHtml(turTemizle(p.tur)) + '</td>' +
            '<td class="col-word" onclick="kelimeOku(\'' + escJs(p.kelime) + '\', this)">' +
              escHtml(p.kelime) +
              (p.ornek ? '<div class="word-hover-ex">' + ornekBicimlendir(p.ornek) + '</div>' : '') +
            '</td>' +
            '<td class="col-meaning">' + escHtml(p.anlam) + '</td>' +
            '<td class="col-example">' + escHtml(p.ornek) + '</td>' +
            '<td class="col-date">' + escHtml(p.tarih) + '</td>' +
            '<td class="col-cb"><input type="checkbox" class="sheet-cb" onchange="kutucukDegisti(' + p.row + ', \'biliyorum\', this.checked)" title="Mark as Known"></td>' +
          '</tr>'
        );
      }
      document.getElementById("poolBody").innerHTML = pRows.join("") || '<tr><td colspan="7" class="center" style="padding:14px;">No words in pool.</td></tr>';

      fcCiz(poolList);
    }

    function kutucukDegisti(row, tip, isChecked) {
      var hedef = null;
      for (var i = 0; i < TUM_KELIMELER.length; i++) {
        if (TUM_KELIMELER[i].row === row) { hedef = TUM_KELIMELER[i]; break; }
      }
      if (!hedef) return;
      var yeniDurum = isChecked ? tip : "beklemede";
      var key = (hedef.kelime || "").toString().trim().toLowerCase();
      SON_YEREL_DEGISIM[key] = Date.now();
      hedef.durum = yeniDurum;
      hedef.biliyorum = yeniDurum === "biliyorum";
      hedef.bilmiyorum = yeniDurum === "bilmiyorum";
      for (var s = 0; s < SHEET_KELIMELER.length; s++) {
        if (SHEET_KELIMELER[s].row === row || (SHEET_KELIMELER[s].kelime || "").toLowerCase() === key) {
          SHEET_KELIMELER[s].durum = yeniDurum;
          SHEET_KELIMELER[s].biliyorum = yeniDurum === "biliyorum";
          SHEET_KELIMELER[s].bilmiyorum = yeniDurum === "bilmiyorum";
        }
      }
      kisiselDurumKaydet(hedef.kelime, yeniDurum);
      tabloyuCiz();
      bildirimGoster("☁️ Saving to Sheet: " + hedef.kelime + "...");

      if (APPS_SCRIPT_URL) {
        document.getElementById("syncDot").className = "sync-dot loading";
        document.getElementById("syncText").innerText = "Saving...";
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "setStatus", row: hedef.row, status: yeniDurum })
        })
          .then(function(r) { return r.json(); })
          .then(function(res) {
            document.getElementById("syncDot").className = "sync-dot";
            document.getElementById("syncText").innerText = "Live (" + TUM_KELIMELER.length + ")";
            if (res && res.ok) {
              bildirimGoster("✅ Synced to Google Sheet: " + hedef.kelime);
            }
          })
          .catch(function() {
            document.getElementById("syncDot").className = "sync-dot";
            document.getElementById("syncText").innerText = "Live (" + TUM_KELIMELER.length + ")";
          });
      }
    }

    function ekleBarAcKapat() {
      document.getElementById("addBar").classList.toggle("open");
      tercihleriKaydet();
    }

    function yeniKelimeKaydet() {
      var kelime = document.getElementById("inKelime").value.trim();
      var anlam = document.getElementById("inAnlam").value.trim();
      if (!kelime || !anlam) { bildirimGoster("Word and Meaning are required."); return; }

      var today = new Date().toISOString().slice(0, 10);
      var yeni = {
        tarih: today,
        kelime: kelime,
        okunus: "",
        tur: document.getElementById("inTur").value,
        seviye: document.getElementById("inSeviye").value,
        anlam: anlam,
        ornek: document.getElementById("inOrnek").value.trim(),
        durum: "bilmiyorum"
      };

      var eklenenler = kisiselEklenenleriAl();
      eklenenler.push(yeni);
      kisiselEklenenKaydet(eklenenler);
      kisiselDurumKaydet(kelime, "bilmiyorum");
      SON_YEREL_DEGISIM[kelime.toLowerCase()] = Date.now();

      document.getElementById("inKelime").value = "";
      document.getElementById("inAnlam").value = "";
      document.getElementById("inOrnek").value = "";

      listeyiBirlestirVeHazirla(SHEET_KELIMELER.length ? SHEET_KELIMELER : FALLBACK_WORDS, false);
      bildirimGoster("☁️ Adding to Google Sheet: " + kelime + "...");

      if (APPS_SCRIPT_URL) {
        var btn = document.getElementById("saveWordBtn");
        if (btn) btn.disabled = true;
        document.getElementById("syncDot").className = "sync-dot loading";
        document.getElementById("syncText").innerText = "Saving...";
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "addWords", words: [yeni] })
        })
          .then(function(r) { return r.json(); })
          .then(function(res) {
            if (btn) btn.disabled = false;
            if (res && res.ok) {
              bildirimGoster("✅ Added to Google Sheet: " + kelime);
              appsScripttenYukle();
            } else {
              document.getElementById("syncDot").className = "sync-dot";
              document.getElementById("syncText").innerText = "Live (" + TUM_KELIMELER.length + ")";
            }
          })
          .catch(function() {
            if (btn) btn.disabled = false;
            document.getElementById("syncDot").className = "sync-dot";
            document.getElementById("syncText").innerText = "Live (" + TUM_KELIMELER.length + ")";
          });
      }
    }

    // Restore all saved button/tab/filter preferences, then render and live sync from Google Sheet
    tercihleriYukleVeUygula();
    listeyiBirlestirVeHazirla(FALLBACK_WORDS);
    verileriYukle(false);
  </script>
</body>
</html>
